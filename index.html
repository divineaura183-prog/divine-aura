        theme:{color:'#9d6bff'},

          try {

['Rudraksh','How to choose your first Rudraksh','Start with a bead that feels comfortable rather than the rarest one. Check that the natural lines (mukhis) are clear, the bead is firm, and the seller can explain the origin.\n\nFor daily wear, a 5-mukhi is the traditional starting point. Ask for a lab or authenticity note, and be careful with any listing that promises miracles.'],
['Rudraksh','Rudraksh care: cleaning, oiling and storage','Wipe the beads with a soft dry cloth. Once a month, rub a drop of pure sesame or mustard oil to keep the surface from drying out.\n\nKeep them away from perfume, soap and long water exposure. Store in a clean cloth or a small wooden box when you are not wearing them.'],

['Kundali','Reading your Kundali: lagna, moon sign and nakshatra','Your lagna (ascendant) is the sign rising at your birth time. The moon sign shows where the Moon sat, and the nakshatra is the lunar mansion that colours temperament and naming syllables.\n\nExact birth time and place matter, because the lagna changes roughly every two hours.'],

const tzOff=(tz,ds)=>{try{const d=ds?new Date(ds+'T12:00:00Z'):new Date(),f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d),g=k=>+f.find(x=>x.type===k).value;
  return Math.round((Date.UTC(g('year'),g('month')-1,g('day'),g('hour'),g('minute'),g('second'))-d.getTime())/9e5)/4}catch(e){return null}};
function applyLoc(p,la,lo,tz,label){const set=(s,v)=>{const el=$('#'+p+s);if(el){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))}};
  set('la',(+la).toFixed(4));set('lo',(+lo).toFixed(4));const c=$('#'+p+'c');if(c)c.value='';
  const z=$('#'+p+'z');if(z){const o=tzOff(tz||Intl.DateTimeFormat().resolvedOptions().timeZone,($('#'+p+'d')||{}).value);if(o!==null){z.value=o;z.dataset.tz=tz||''}}

async function revGeo(la,lo){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=en`),j=await r.json();return [j.city||j.locality,j.principalSubdivision,j.countryName].filter(Boolean).join(', ')}catch(e){return ''}}
function locate(p,silent){const s=$('#'+p+'st');if(!navigator.geolocation){if(s)s.textContent='Location is not supported on this device. Search your city instead.';return}
  if(s)s.textContent='Finding your location…';
  navigator.geolocation.getCurrentPosition(async pos=>{const{latitude:la,longitude:lo}=pos.coords;applyLoc(p,la,lo,null,'Locating…');applyLoc(p,la,lo,null,await revGeo(la,lo)||'Current location')},
   err=>{if(s)s.textContent=silent?'Tap “Use my location” or search your birth city.':'Location blocked. Allow it in your browser, or search your birth city.'},{enableHighAccuracy:false,timeout:10000,maximumAge:3e5})}
function wireLoc(p){if($('#'+p+'ls')||!$('#'+p+'la'))return;const anchor=$('#'+p+'c').closest('.two');

  $('#'+p+'gps').onclick=()=>locate(p,false);

    t=setTimeout(async()=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name='+encodeURIComponent(v)),j=await r.json();
      ul.innerHTML=(j.results||[]).map((x,i)=>`<li><button type="button" data-i="${i}">${[x.name,x.admin1,x.country].filter(Boolean).join(', ')}</button></li>`).join('')||'<li><small>No match. Try a nearby larger city.</small></li>';
      ul.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=j.results[+b.dataset.i];applyLoc(p,x.latitude,x.longitude,x.timezone,[x.name,x.admin1,x.country].filter(Boolean).join(', '));ul.innerHTML='';$('#'+p+'q').value=x.name})}catch(e){ul.innerHTML='<li><small>Search needs internet. You can still pick a city above.</small></li>'}},350)};
  const d=$('#'+p+'d');if(d)d.addEventListener('change',()=>{const z=$('#'+p+'z');if(z&&z.dataset.tz){const o=tzOff(z.dataset.tz,d.value);if(o!==null)z.value=o}});
